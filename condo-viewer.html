<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Floor Plan - Lumina Project</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (matching your index.html) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (Standalone) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Smooth transitions for tabs */
        .tab-transition { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- SPECIFICATIONS DICTIONARY ---
        const UNIT_SPECS = {
          'STUDIO': {
            type: 'Studio Suite', isResidential: true, beds: 1, baths: 1, sqft: 280, price: '$210,000',
            description: 'Compact, ultra-efficient living space perfect for young professionals. Features smart-home tech and hidden storage.',
            color: 'bg-emerald-900/40', borderColor: 'border-emerald-500', hoverColor: 'hover:bg-emerald-800/60', textColor: 'text-emerald-400'
          },
          '1-BED': {
            type: '1 Bedroom Suite', isResidential: true, beds: 1, baths: 1, sqft: 470, price: '$350,000',
            description: 'A brilliantly designed one-bedroom suite featuring floor-to-ceiling windows, a modern European kitchen, and a private balcony.',
            color: 'bg-teal-900/40', borderColor: 'border-teal-500', hoverColor: 'hover:bg-teal-800/60', textColor: 'text-teal-400'
          },
          '2-BED': {
            type: '2 Bedroom Corner', isResidential: true, beds: 2, baths: 2, sqft: 750, price: '$580,000',
            description: 'Spacious corner unit offering panoramic city views. Includes a primary suite with a walk-in closet and en-suite luxury bathroom.',
            color: 'bg-blue-900/40', borderColor: 'border-blue-500', hoverColor: 'hover:bg-blue-800/60', textColor: 'text-blue-400'
          },
          '3-BED': {
            type: '3 Bedroom Family', isResidential: true, beds: 3, baths: 3, sqft: 1150, price: '$980,000',
            description: 'Expansive family residence with a massive open-plan living area, maid quarters, and premium imported fixtures.',
            color: 'bg-indigo-900/40', borderColor: 'border-indigo-500', hoverColor: 'hover:bg-indigo-800/60', textColor: 'text-indigo-400'
          },
          'PENTHOUSE': {
            type: 'Grand Penthouse', isResidential: true, beds: 4, baths: 4.5, sqft: 2450, price: '$3,200,000',
            description: 'The pinnacle of luxury living. This full-floor penthouse boasts a private elevator lobby, massive wraparound terrace, and custom designer finishes.',
            color: 'bg-amber-900/40', borderColor: 'border-amber-500', hoverColor: 'hover:bg-amber-800/60', textColor: 'text-amber-400'
          },
          // Amenities
          'PARKING': {
            type: 'Resident Parking', isResidential: false, icon: 'fas fa-car', stat1: 'Auto-Parking', stat2: 'EV Ready', sqft: 'Multiple', price: 'Included',
            description: 'Secure, 24/7 monitored resident parking facility with dedicated EV charging stations.',
            color: 'bg-slate-800/80', borderColor: 'border-slate-500', hoverColor: 'hover:bg-slate-700/80', textColor: 'text-slate-300'
          },
          'COWORK': {
            type: 'Co-working Lounge', isResidential: false, icon: 'fas fa-wifi', stat1: 'High-Speed Wi-Fi', stat2: 'Meeting Rooms', sqft: 3200, price: 'Exclusive Access',
            description: 'A dedicated floor for remote work and collaboration, featuring hot desks and soundproof pods.',
            color: 'bg-purple-900/40', borderColor: 'border-purple-500', hoverColor: 'hover:bg-purple-800/60', textColor: 'text-purple-400'
          },
          'KITCHEN': {
            type: 'Shared Kitchen', isResidential: false, icon: 'fas fa-mug-hot', stat1: 'Barista Machine', stat2: 'Events', sqft: 800, price: 'Communal',
            description: 'A fully equipped communal kitchen and dining area.',
            color: 'bg-orange-900/40', borderColor: 'border-orange-500', hoverColor: 'hover:bg-orange-800/60', textColor: 'text-orange-400'
          },
          '7-ELEVEN': {
            type: 'Commodity Retail', isResidential: false, icon: 'fas fa-store', stat1: '24/7 Access', stat2: 'Groceries', sqft: 1200, price: 'Public & Residents',
            description: 'Convenience at your doorstep. A fully stocked 24/7 convenience store.',
            color: 'bg-red-900/40', borderColor: 'border-red-500', hoverColor: 'hover:bg-red-800/60', textColor: 'text-red-400'
          },
          'GYM': {
            type: 'Fitness Center', isResidential: false, icon: 'fas fa-dumbbell', stat1: '24/7 Access', stat2: 'Cardio & Weights', sqft: 2500, price: 'Exclusive Access',
            description: 'State-of-the-art fitness center featuring cardio machines, free weights, and a yoga studio.',
            color: 'bg-rose-900/40', borderColor: 'border-rose-500', hoverColor: 'hover:bg-rose-800/60', textColor: 'text-rose-400'
          },
          'POOL': {
            type: 'Infinity Pool', isResidential: false, icon: 'fas fa-water', stat1: 'Temp Controlled', stat2: 'Sky Deck', sqft: 4000, price: 'Exclusive Access',
            description: 'A stunning resort-style infinity pool with an adjacent sun deck and cabanas.',
            color: 'bg-cyan-900/40', borderColor: 'border-cyan-500', hoverColor: 'hover:bg-cyan-800/60', textColor: 'text-cyan-400'
          }
        };

        // --- DYNAMIC FLOOR GENERATORS ---
        // Tower A: 40 Floors (Studio & 1BR Focus)
        const generateTowerA = () => {
            const floors = [];
            floors.push({ level: 40, name: 'Floor 40 - Penthouse', type: 'penthouse', units: ['PHA-40'] });
            floors.push({ level: 39, name: 'Floor 39 - Penthouse', type: 'penthouse', units: ['PHA-39'] });
            
            for (let i = 38; i >= 7; i--) {
                floors.push({ 
                    level: i, name: `Floor ${i} - Residential`, type: 'standard-a', 
                    units: [`${i}01`,`${i}02`,`${i}03`,`${i}04`,`${i}05`,`${i}06`,`${i}07`,`${i}08`,`${i}09`,`${i}10`] 
                });
            }
            floors.push({ level: 6, name: 'Floor 6 - Sky Amenities', type: 'amenities', units: ['POOL', 'GYM'] });
            for (let i = 5; i >= 1; i--) { floors.push({ level: i, name: `Floor ${i} - Parking`, type: 'parking', units: [`P${i}`] }); }
            return floors;
        };

        // Tower B: 40 Floors (1BR, 2BR, 3BR Focus)
        const generateTowerB = () => {
            const floors = [];
            floors.push({ level: 40, name: 'Floor 40 - Penthouse', type: 'penthouse', units: ['PHB-40'] });
            floors.push({ level: 39, name: 'Floor 39 - Penthouse', type: 'penthouse', units: ['PHB-39'] });
            
            for (let i = 38; i >= 8; i--) {
                floors.push({ 
                    level: i, name: `Floor ${i} - Residential`, type: 'standard-b', 
                    units: [`${i}01`,`${i}02`,`${i}03`,`${i}04`,`${i}05`,`${i}06`] 
                });
            }
            floors.push({ level: 7, name: 'Floor 7 - Amenities & Lounge', type: 'amenities', units: ['POOL', 'GYM'] });
            for (let i = 6; i >= 1; i--) { floors.push({ level: i, name: `Floor ${i} - Parking`, type: 'parking', units: [`P${i}`] }); }
            return floors;
        };

        // Tower C: 12 Floors (Low Rise Mixed)
        const generateTowerC = () => {
            return [
              { level: 12, name: 'Floor 12 - Penthouse', type: 'penthouse', units: ['PHC-12'] },
              { level: 11, name: 'Floor 11 - Amenities', type: 'amenities', units: ['GYM', 'POOL'] },
              { level: 10, name: 'Floor 10 - Residential', type: 'standard-c', units: ['1001','1002','1003','1004','1005','1006','1007','1008'] },
              { level: 9, name: 'Floor 9 - Residential', type: 'standard-c', units: ['901','902','903','904','905','906','907','908'] },
              { level: 8, name: 'Floor 8 - Residential', type: 'standard-c', units: ['801','802','803','804','805','806','807','808'] },
              { level: 7, name: 'Floor 7 - Residential', type: 'standard-c', units: ['701','702','703','704','705','706','707','708'] },
              { level: 6, name: 'Floor 6 - Residential', type: 'standard-c', units: ['601','602','603','604','605','606','607','608'] },
              { level: 5, name: 'Floor 5 - Residential', type: 'standard-c', units: ['501','502','503','504','505','506','507','508'] },
              { level: 4, name: 'Floor 4 - Coworking & Retail', type: 'coworking', units: ['COWORK', 'KITCHEN', '7-ELEVEN'] },
              { level: 3, name: 'Floor 3 - Parking', type: 'parking', units: ['P3'] },
              { level: 2, name: 'Floor 2 - Parking', type: 'parking', units: ['P2'] },
              { level: 1, name: 'Floor 1 - Ground Parking', type: 'parking', units: ['P1'] },
            ];
        };

        const BUILDINGS = {
            'A': { id: 'A', name: 'Tower A', type: 'High-Rise (40 Floors)', desc: 'Optimized for young professionals, exclusively featuring ultra-efficient Studios and 1-Bedroom suites.', floors: generateTowerA() },
            'B': { id: 'B', name: 'Tower B', type: 'High-Rise (40 Floors)', desc: 'Designed for families and space-seekers. Features expansive 1-Bed, 2-Bed, and 3-Bedroom corner configurations.', floors: generateTowerB() },
            'C': { id: 'C', name: 'Tower C', type: 'Low-Rise (12 Floors)', desc: 'Exclusive, intimate low-rise living with a balanced mix of units, coworking spaces, and direct retail access.', floors: generateTowerC() }
        };

        function App() {
          const [activeBuildingId, setActiveBuildingId] = useState('A');
          const building = BUILDINGS[activeBuildingId];
          
          // Default to the first standard residential floor of the selected building
          const [activeFloor, setActiveFloor] = useState(building.floors.find(f => f.type.startsWith('standard')) || building.floors[0]);
          const [activeUnit, setActiveUnit] = useState(null);

          const handleBuildingSwitch = (id) => {
              setActiveBuildingId(id);
              const newBuilding = BUILDINGS[id];
              // Find the first residential floor to show by default
              const defaultFloor = newBuilding.floors.find(f => f.type.startsWith('standard')) || newBuilding.floors[0];
              setActiveFloor(defaultFloor);
              setActiveUnit(null);
          };

          const handleFloorSelect = (floor) => {
            setActiveFloor(floor);
            setActiveUnit(null); 
          };

          const handleUnitSelect = (unitId, unitType) => {
            setActiveUnit({ id: unitId, ...UNIT_SPECS[unitType] });
          };

          const getFloorVisualClass = (type) => {
            if(type === 'parking') return 'bg-slate-700/50 border-slate-600';
            if(type === 'coworking') return 'bg-purple-900/50 border-purple-700';
            if(type === 'amenities') return 'bg-cyan-900/50 border-cyan-700';
            if(type === 'penthouse') return 'bg-amber-700/50 border-amber-600';
            return 'bg-slate-800 border-slate-700';
          };

          return (
            <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-[1600px] mx-auto">
              
              {/* Header */}
              <header className="mb-6 flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 gap-4">
                <div>
                  <div className="flex flex-wrap items-center gap-4 mb-2">
                    <h1 className="text-3xl md:text-4xl font-light tracking-widest text-white uppercase flex items-center gap-3">
                      <i className="fas fa-city text-amber-500"></i>
                      Lumina <span className="font-bold text-amber-500">Project</span>
                    </h1>
                    <span className="px-3 py-1 bg-rose-500/10 border border-rose-500/30 text-rose-400 rounded-full text-xs font-bold tracking-wider uppercase flex items-center gap-2 shadow-[0_0_10px_rgba(244,63,94,0.1)]">
                      <i className="fas fa-tools text-xs"></i> WIP (Phase 1)
                    </span>
                  </div>
                  <p className="text-slate-400 mt-2 text-sm tracking-wide">
                    TOTAL SUPPLY: <span className="text-slate-200">201 Studios • 448 1-Bed • 153 2-Bed • 44 3-Bed • 21 Penthouses</span> 
                    <span className="ml-3 text-rose-400/80 text-xs italic tracking-normal border-l border-slate-700 pl-3">* All 8 Locations pending</span>
                  </p>
                </div>
                <div>
                  <a href="index.html" className="inline-flex items-center gap-2 px-6 py-2.5 border border-slate-700 text-slate-300 rounded-full hover:bg-slate-800 hover:text-white transition text-sm font-medium">
                    <i className="fas fa-arrow-left"></i> Back to Dashboard
                  </a>
                </div>
              </header>

              {/* Building Selector Tabs */}
              <div className="flex flex-wrap gap-3 mb-8">
                  {Object.values(BUILDINGS).map(b => (
                      <button 
                          key={b.id} 
                          onClick={() => handleBuildingSwitch(b.id)}
                          className={`flex-1 min-w-[250px] p-4 rounded-2xl border text-left tab-transition flex items-start gap-4
                            ${activeBuildingId === b.id 
                                ? 'bg-amber-500/10 border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.05)]' 
                                : 'bg-slate-900/50 border-slate-800 hover:bg-slate-800'}`}
                      >
                          <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0 ${activeBuildingId === b.id ? 'bg-amber-500 text-slate-900' : 'bg-slate-800 text-slate-400'}`}>
                              <i className={`fas fa-building`}></i>
                          </div>
                          <div>
                              <h3 className={`font-bold text-lg ${activeBuildingId === b.id ? 'text-amber-400' : 'text-slate-300'}`}>{b.name}</h3>
                              <p className="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">{b.type}</p>
                              <p className="text-sm text-slate-400 line-clamp-2 leading-snug">{b.desc}</p>
                          </div>
                      </button>
                  ))}
              </div>

              {/* Main Content Area */}
              <main className="flex-1 flex flex-col lg:flex-row gap-8">
                
                {/* Left Column: Building Navigator */}
                <div className="w-full lg:w-72 flex-shrink-0 flex flex-col gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                    <h2 className="text-sm font-bold tracking-widest text-slate-500 uppercase mb-4 flex items-center gap-2">
                      <i className="fas fa-layer-group"></i> Select Level
                    </h2>
                    
                    {/* Floor List */}
                    <div className="flex flex-col gap-1.5 max-h-[45vh] overflow-y-auto pr-2 custom-scrollbar">
                      {building.floors.map((floor) => (
                        <button
                          key={floor.level}
                          onClick={() => handleFloorSelect(floor)}
                          className={`flex items-center justify-between px-4 py-3 rounded-xl transition-all duration-300 ${
                            activeFloor.level === floor.level
                              ? 'bg-amber-500/10 border border-amber-500/50 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.1)]'
                              : 'bg-slate-950 border border-slate-800 text-slate-400 hover:bg-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <span className="font-medium text-sm text-left">{floor.name}</span>
                          {activeFloor.level === floor.level && <i className="fas fa-chevron-right text-xs flex-shrink-0"></i>}
                        </button>
                      ))}
                    </div>
                    
                    {/* Building Visual Representation */}
                    <div className="mt-6 relative h-48 w-full bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex items-end justify-center p-4">
                      <div className="w-20 h-full flex flex-col-reverse gap-[1px]">
                        {building.floors.map((f) => (
                          <div 
                            key={`vis-${f.level}`}
                            className={`w-full flex-1 rounded-sm transition-all duration-300 ${
                              activeFloor.level === f.level 
                                ? 'bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.8)] z-10' 
                                : getFloorVisualClass(f.type)
                            }`}
                          />
                        ))}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Middle Column: Interactive Floor Map */}
                <div className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 lg:p-10 shadow-xl flex flex-col">
                  <div className="flex justify-between items-center mb-8">
                    <div>
                      <h2 className="text-2xl font-light text-white">{activeFloor.name} Plan</h2>
                      <p className="text-slate-400 text-sm mt-1">Select a highlighted zone to view details</p>
                    </div>
                    <i className="fas fa-map text-slate-500 text-2xl"></i>
                  </div>

                  {/* Blueprint Container */}
                  <div className="flex-1 bg-slate-950 rounded-xl border border-slate-800 p-4 md:p-8 flex items-center justify-center relative overflow-hidden group min-h-[450px]">
                    <div className="absolute inset-0 opacity-[0.03] pointer-events-none" 
                         style={{ backgroundImage: 'linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px)', backgroundSize: '20px 20px' }}>
                    </div>

                    <div className="w-full max-w-4xl aspect-[16/8] relative">
                      
                      {/* --- PARKING LAYOUT --- */}
                      {activeFloor.type === 'parking' && (
                        <div className="w-full h-full grid grid-cols-8 grid-rows-[3fr_1fr_3fr] gap-1.5 relative z-10" onClick={() => handleUnitSelect(activeFloor.units[0], 'PARKING')}>
                          <div className={`col-span-1 border-2 border-dashed rounded-tl-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['PARKING'].color} ${UNIT_SPECS['PARKING'].borderColor} ${UNIT_SPECS['PARKING'].hoverColor}`}><i className="fas fa-car text-slate-500 text-xl"></i></div>
                          <div className="bg-slate-800/80 border border-slate-700 flex flex-col items-center justify-center pointer-events-none">
                            <div className="w-6 h-6 border border-slate-600 mb-1 flex items-center justify-center"><span className="text-[8px]">LIFT</span></div>
                            <div className="w-6 h-6 border border-slate-600 flex items-center justify-center"><span className="text-[8px]">LIFT</span></div>
                          </div>
                          <div className={`col-span-6 border-2 border-dashed rounded-tr-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['PARKING'].color} ${UNIT_SPECS['PARKING'].borderColor} ${UNIT_SPECS['PARKING'].hoverColor}`}><i className="fas fa-car text-slate-500 text-xl"></i></div>

                          <div className="col-span-8 bg-slate-800/50 border-y border-slate-700 flex items-center justify-center pointer-events-none">
                             <span className="text-slate-500 text-xs tracking-[0.5em] uppercase">Drive Lane Center</span>
                          </div>

                          <div className={`col-span-1 border-2 border-dashed rounded-bl-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['PARKING'].color} ${UNIT_SPECS['PARKING'].borderColor} ${UNIT_SPECS['PARKING'].hoverColor}`}><i className="fas fa-car text-slate-500 text-xl"></i></div>
                          <div className="bg-slate-800/80 border border-slate-700 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-[10px] text-slate-500 rotate-90 tracking-widest">STAIRS</span>
                          </div>
                          <div className={`col-span-6 border-2 border-dashed rounded-br-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['PARKING'].color} ${UNIT_SPECS['PARKING'].borderColor} ${UNIT_SPECS['PARKING'].hoverColor}`}>
                             <span className="font-bold text-xl text-white tracking-widest flex items-center gap-3"><i className="fas fa-car text-slate-400"></i> {activeFloor.name.toUpperCase()}</span>
                          </div>
                        </div>
                      )}

                      {/* --- COWORKING & RETAIL (Tower C only) --- */}
                      {activeFloor.type === 'coworking' && (
                        <div className="w-full h-full grid grid-cols-8 grid-rows-[3fr_1fr_3fr] gap-1.5 relative z-10">
                          <div onClick={() => handleUnitSelect('COWORK', 'COWORK')} className={`col-span-1 border-2 rounded-tl-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['COWORK'].color} ${UNIT_SPECS['COWORK'].borderColor} ${UNIT_SPECS['COWORK'].hoverColor} ${activeUnit?.id === 'COWORK' ? 'ring-2 ring-amber-500 z-20' : ''}`}><i className="fas fa-wifi text-purple-400 text-xl"></i></div>
                          <div className="bg-slate-800/80 border border-slate-700 flex flex-col items-center justify-center pointer-events-none">
                            <div className="w-6 h-6 border border-slate-600 mb-1 flex items-center justify-center"><span className="text-[8px]">LIFT</span></div>
                            <div className="w-6 h-6 border border-slate-600 flex items-center justify-center"><span className="text-[8px]">LIFT</span></div>
                          </div>
                          <div onClick={() => handleUnitSelect('COWORK', 'COWORK')} className={`col-span-4 border-2 flex flex-col items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['COWORK'].color} ${UNIT_SPECS['COWORK'].borderColor} ${UNIT_SPECS['COWORK'].hoverColor} ${activeUnit?.id === 'COWORK' ? 'ring-2 ring-amber-500 z-20' : ''}`}>
                             <span className="font-bold text-xl text-white">Co-Working Lounge</span>
                          </div>
                          <div onClick={() => handleUnitSelect('KITCHEN', 'KITCHEN')} className={`col-span-2 border-2 rounded-tr-xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['KITCHEN'].color} ${UNIT_SPECS['KITCHEN'].borderColor} ${UNIT_SPECS['KITCHEN'].hoverColor} ${activeUnit?.id === 'KITCHEN' ? 'ring-2 ring-amber-500 z-20' : ''}`}>
                             <i className="fas fa-mug-hot text-orange-400 text-xl mb-1"></i>
                             <span className="font-bold text-sm text-white">Kitchen</span>
                          </div>

                          <div className="col-span-8 bg-slate-300/10 border-y border-slate-700 flex items-center justify-center pointer-events-none">
                             <span className="text-slate-500 text-xs tracking-[0.5em] uppercase">Main Corridor</span>
                          </div>

                          <div onClick={() => handleUnitSelect('COWORK', 'COWORK')} className={`col-span-1 border-2 rounded-bl-xl flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['COWORK'].color} ${UNIT_SPECS['COWORK'].borderColor} ${UNIT_SPECS['COWORK'].hoverColor} ${activeUnit?.id === 'COWORK' ? 'ring-2 ring-amber-500 z-20' : ''}`}><i className="fas fa-wifi text-purple-400 text-xl"></i></div>
                          <div className="bg-slate-800/80 border border-slate-700 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-[10px] text-slate-500 rotate-90 tracking-widest">STAIRS</span>
                          </div>
                          <div onClick={() => handleUnitSelect('COWORK', 'COWORK')} className={`col-span-3 border-2 flex items-center justify-center cursor-pointer transition-all duration-300 ${UNIT_SPECS['COWORK'].color} ${UNIT_SPECS['COWORK'].borderColor} ${UNIT_SPECS['COWORK'].hoverColor} ${activeUnit?.id === 'COWORK' ? 'ring-2 ring-amber-500 z-20' : ''}`}>
                             <span className="text-sm text-purple-400">Meeting Rooms</span>
                          </div>

                          </div>

                          {/* BOTTOM ROW: 5 Units */}
                          {[
                            { u: activeFloor.units[5], t: '1-BED', span: 'col-span-1 rounded-bl-xl' },

                            { u: 'CORE', t: 'CORE', span: 'col-span-1' },

                            { u: activeFloor.units[2], t: '2-BED', span: 'col-span-2 rounded-tr-xl' }

                      <div className="flex-1 flex flex-col items-center justify-center text-center opacity-50">

                      </div>
                    )}
                  </div>
                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
